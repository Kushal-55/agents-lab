[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab"
version = "0.1.0"
description = "A learning journey from a single LLM call to a self-learning finance agent, using only free services."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]  # httpx: tests build fake HTTP errors

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["legacy"]  # historical files, kept as-is
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "SIM905"]  # asserts are fine in tests; keep the readable stopword string

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"levels/*" = ["E402"]
